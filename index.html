<style>
:root{--bg:#f6f4ef;--base:#f6f4ef;--fg:#1f2430;--mu:#6b7080;--cd:#fff;--ln:#e3dfd6;--todo:#3d6fb0;--prog:#d98a1f;--done:#3a8d5c;--stat:#7a5fb0;--bad:#c4513f;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#171a21;--base:#171a21;--fg:#eceae4;--mu:#9399a8;--cd:#222632;--ln:#303546;--todo:#6f9fe0;--prog:#f0a43a;--done:#5fb783;--stat:#a58be0;--bad:#e58070}}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg);max-width:480px;margin:auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
body[data-tab=todo]{--ac:var(--todo)}body[data-tab=prog]{--ac:var(--prog)}body[data-tab=done]{--ac:var(--done)}body[data-tab=stat]{--ac:var(--stat)}body[data-tab=set]{--ac:var(--mu)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:3px solid var(--area,var(--ln))}
.tabs{display:flex}#ab{display:flex;gap:6px;padding:8px 12px 4px;overflow-x:auto}.ar{border:1px solid var(--ln);background:var(--cd);color:var(--fg);font:inherit;font-size:14px;border-radius:20px;padding:6px 14px;min-height:36px;white-space:nowrap;cursor:pointer}.ar.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.cn{font-size:11px;background:var(--prog);color:#fff;border-radius:10px;padding:0 6px;margin-left:6px}
.tab,.gear{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;min-height:48px;border-bottom:3px solid transparent;cursor:pointer}
.tab{flex:1;padding:0 2px}.gear{width:44px;font-size:18px}
.tab.on{color:var(--ac);font-weight:600;border-color:var(--ac)}
main{padding:12px}
.c{background:var(--cd);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.r{display:flex;align-items:center;gap:8px}.ti{flex:1;min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;cursor:pointer}
.st{color:#e0a800}.rp{color:var(--mu);font-style:normal}
.tm{font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:1px 8px;color:var(--mu)}.tm.late{color:var(--bi,#fff);background:var(--bad);border-color:var(--bad)}
.bt{display:flex;gap:6px}button{font:inherit}
.bt button,.sm{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font-size:18px;cursor:pointer}
.bt button:disabled{opacity:.3}.ok{background:var(--done)!important;color:var(--di,#fff)!important;border:0!important}.no{color:var(--bad)!important}
.bt button{padding:0 6px}.bt button small{display:block;font-size:10px;line-height:1.1;margin-top:2px}
.sm{font-size:14px;padding:0 12px;min-height:40px}.pri{background:var(--ac);color:var(--ai,#fff);border:0}
.ds{padding:6px 0 4px;color:var(--mu);font-size:15px}.ds .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{color:var(--mu);text-align:center;margin:40px 20px}
h3{margin:18px 0 8px;font-size:15px}.day{margin:16px 0 6px;font-size:14px;color:var(--mu);position:sticky;top:calc(96px + env(safe-area-inset-top));background:var(--bg);padding:2px 0}
.big{font-size:44px;font-weight:700;line-height:1;color:var(--done)}.mu{color:var(--mu);font-size:14px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ln)}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--ai,#fff);font-size:30px;cursor:pointer}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--cd);color:var(--fg)}
label{display:block;margin:10px 0 0;font-size:14px;color:var(--mu)}label.ck{display:inline-flex;align-items:center;gap:4px;margin-right:8px}label.ck input{width:auto}
dialog{width:min(440px,94vw);border:0;border-radius:14px;background:var(--bg);color:var(--fg);padding:16px}dialog::backdrop{background:#0008}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row .sm{flex:1}
.rb{display:flex;align-items:center;gap:8px;margin:6px 0}.rb i{height:18px;background:var(--stat);border-radius:4px;min-width:3px}
.toast,#upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;font-size:14px;max-width:90vw}
#upd{top:calc(60px + env(safe-area-inset-top));bottom:auto;display:none}#upd button{margin-left:8px}
body{--bg:var(--base)}@supports(background:color-mix(in srgb,red,blue)){body{--bg:color-mix(in srgb,var(--area,#888) 10%,var(--base))}}
.ar{border:2px solid var(--c)}.ar{box-shadow:0 0 0 1px var(--ln)}.ar.on{background:var(--c);color:var(--ct);border-color:var(--c)}header{box-shadow:0 1px 0 var(--ln)}.cn{background:var(--fg);color:var(--bg)}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.swb{width:48px;height:48px;border-radius:50%;border:0;color:#fff;font-size:20px;cursor:pointer}
.sm small{display:block;font-size:10px;line-height:1.1}
.set h3{border-top:1px solid var(--ln);margin:26px 0 10px;padding-top:18px;font-size:16px}.set h3:first-child{border-top:0;margin-top:0;padding-top:0}
#splash{position:fixed;inset:0;z-index:100;background:var(--base);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s}
#splash.off{opacity:0;pointer-events:none}#splash img{width:132px;height:132px;border-radius:50%;display:block}
#splash .tg{margin-top:28px;font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--fg)}
#splash .ld{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
#splash .vr{color:var(--mu);font-size:13px;min-height:1.2em}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--ln);border-top-color:var(--prog);animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.foot{text-align:center;margin-top:30px;color:var(--mu);font-size:14px;line-height:1.5}.foot img{width:44px;height:44px;border-radius:50%;display:block;margin:0 auto 8px}
.set h3.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}.dng{background:var(--bad)!important;color:var(--bi,#fff)!important;border:0!important}
</style></head><body data-tab="prog">
<div id="splash" role="status"><img src="icon-512.png" alt=""><div class="tg">plan, do, done.</div><div class="ld"><div class="spin"></div><div id="spl">Wczytywanie…</div><div class="vr" id="spv"></div></div></div>
<script>(function(){var l;try{l=localStorage.getItem('kanban-lang')}catch(e){}if(!l)l=/^en/i.test(navigator.language||'')?'en':'pl';document.getElementById('spl').textContent=l==='en'?'Loading…':'Wczytywanie…';setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},4000)})()</script>
<header><div id="ab"></div><nav class="tabs"><button class="tab" data-a="tab" data-tab="todo">Do zrobienia</button><button class="tab" data-a="tab" data-tab="prog">Dzisiaj</button><button class="tab" data-a="tab" data-tab="done">Zrobione</button><button class="tab" data-a="tab" data-tab="stat">Statystyki</button><button class="gear" data-a="tab" data-tab="set" aria-label="Ustawienia">⚙</button></nav></header>
<main id="main"></main><div id="bar"></div><div id="upd">Dostępna nowa wersja <button class="sm" data-a="upd">Odśwież</button></div>
<dialog id="dlg"></dialog>
<script src="lang/pl.js"></script><script src="lang/en.js"></script>
<script>
const V='1.8.1',SPLASH_MS=1000,SCHEMA=2,PAL=['#2a9d8f','#da6887','#3976be','#e08a2e','#8565b4','#6b9a2f','#c9a227','#878c9b'],PICK=PAL.concat(['#ffffff','#1f2430']),K='kanban-v1',$=id=>document.getElementById(id);
const LG=window.LANGS||{};
let LANG=(()=>{try{const l=localStorage.getItem('kanban-lang');if(l&&LG[l])return l}catch(e){}return /^en/i.test(navigator.language||'')?'en':'pl'})();
const tr=(k,p)=>{let s=(LG[LANG]&&LG[LANG][k])||k;if(p)for(const n in p)s=s.split('{'+n+'}').join(p[n]);return s};
const LOC=()=>LANG==='en'?'en-GB':'pl-PL',dm=s=>new Date(s+'T12:00:00').toLocaleDateString(LOC(),{day:'numeric',month:'numeric'});
const DN=d=>tr(['nd','pn','wt','śr','cz','pt','sb'][d]);
let tab='prog',per=30,smore=null,sort=false,tsort=false,ssort=null,open=null,pos={},pendingSW=null;
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ds(new Date());
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ink=h=>{const L=lum(h);return 1.05/(L+.05)>=(L+.05)/.068?'#ffffff':'#1f2430'};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.tasks)return migrate(s)}catch(e){}
return migrate({schema:SCHEMA,tasks:[],log:[],last:'',reasons:['brak czasu','brak chęci','zapomniałem','pilniejsza sprawa','źle oszacowany czas','zmęczenie/choroba','inne'].map((n,i)=>({id:'r'+i,name:tr(n)}))})}
function migrate(s){if(!s.areas||!s.areas.length)s.areas=[{id:'a1',name:tr('Prywatna')},{id:'a2',name:tr('Zawodowa')}];if(!s.areas.some(a=>a.id===s.area))s.area=s.areas[0].id;const d=s.areas[0].id;(s.tasks||[]).forEach(x=>{if(!x.area)x.area=d});(s.log||[]).forEach(x=>{if(!x.area)x.area=d});s.areas.forEach((a,i)=>{if(!a.color)a.color=PAL[i%PAL.length]});if(!s.ro){const m={};(s.log||[]).forEach(l=>{if(l.reason)m[l.reason]=(m[l.reason]||0)+1});(s.reasons=s.reasons||[]).sort((a,b)=>(m[b.id]||0)-(m[a.id]||0)||a.name.localeCompare(b.name,LANG));s.ro=1}if(!s.pm){(s.areas||[]).forEach(a=>{const l=(s.tasks||[]).filter(x=>x.area===a.id&&!x.tpl&&x.st==='todo').reverse(),z=x=>x.rep&&x.rep.k!=='none'||x.at;[...l.filter(x=>!z(x)),...l.filter(z)].forEach((x,i)=>x.po=i)});s.pm=1}s.schema=SCHEMA;return s}
let S=load();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast(tr('Nie udało się zapisać danych'))}};
function toastU(m,id,ms=6000){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.innerHTML=esc(m)+` <button class=sm data-a=ud data-id="${id}" style="margin-left:8px">${tr('Cofnij')}</button>`;document.body.append(t);setTimeout(()=>t.remove(),ms)}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)}
function sheet(h){$('dlg').innerHTML=h;$('dlg').showModal()}
function ask(title,opts,cb){sheet(`<h3>${title}</h3><div class=row>${opts.map((o,i)=>`<button class="sm" data-o="${i}">${o[0]}</button>`).join('')}</div><div class=row><button class="sm" data-o="x">${tr('Anuluj')}</button></div>`);
$('dlg').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;$('dlg').close();if(b.dataset.o!=='x')cb(opts[b.dataset.o][1])}}
/* --- logika zadań --- */
const prog=(a=S.area)=>S.tasks.filter(x=>x.st==='prog'&&x.area===a).sort((a,b)=>a.ord-b.ord);
function put(t){const l=prog(t.area).filter(x=>x!==t);let i=l.length;
 if(t.imp){i=0;l.forEach((x,j)=>{if(x.imp)i=j+1})}
 else if(t.time){const j=l.findIndex(x=>!x.imp&&x.time&&x.time>t.time);if(j>=0)i=j}
 l.splice(i,0,t);l.forEach((x,j)=>x.ord=j)}
const kind=x=>x.rep.k!=='none'||x.at?'z':'o';
const tdl=a=>S.tasks.filter(x=>x.area===a&&!x.tpl&&x.st==='todo').sort((p,q)=>(p.po??0)-(q.po??0));
function place(t,where){const l=tdl(t.area).filter(x=>x!==t);if(where==='top')l.unshift(t);else l.push(t);l.forEach((x,i)=>x.po=i)}
const mvt=(x,d)=>{const l=tdl(x.area),i=l.indexOf(x),j=d===-99?0:Math.max(0,Math.min(l.length-1,i+d));if(i<0||j===i)return;l.splice(i,1);l.splice(j,0,x);l.forEach((y,k)=>y.po=k)};
function toDay(t){if(t.rep.k!=='none'){if(S.tasks.some(x=>x.tpl===t.id&&x.st==='prog'))return toast(tr('To zadanie jest już w Dzisiaj'));
 const i={id:uid(),area:t.area,tpl:t.id,t:t.t,d:t.d,time:t.time,imp:t.imp,cnt:t.cnt||1,exp:t.exp,n:0,rep:{k:'none',days:[]},st:'prog',date:today()};S.tasks.push(i);put(i)}
 else{delete t.at;t.st='prog';t.date=today();t.n=0;put(t)}}
function fail(x,date,kind){S.log.push({k:kind||'p',id:uid(),tid:x.id,area:x.area,tpl:x.tpl||null,title:x.t,date,res:'fail',reason:null,dec:'todo',...(x.cnt>1?{n:x.n||0,cnt:x.cnt}:{})});x.st=x.tpl?'closed':'todo';if(!x.tpl)place(x,'top')}
function done(x){const id=uid();S.log.push({id,tid:x.id,area:x.area,tpl:x.tpl||null,title:x.t,date:today(),res:'done',...(x.cnt>1?{n:x.n||0,cnt:x.cnt}:{})});x.st=x.tpl?'closed':'done';return id}
function sched(){S.tasks.filter(t=>t.st==='todo'&&t.at&&t.at<=today()&&t.rep.k==='none'&&!t.tpl).forEach(t=>{delete t.at;toDay(t)})}
function roll(){const td=today();
 S.tasks.filter(x=>x.st==='prog'&&x.exp&&x.date<td).forEach(x=>fail(x,x.date,'f'));
  if(S.last!==td){const w=new Date().getDay();S.tasks.filter(t=>t.rep.k!=='none'&&t.st==='todo'&&(t.rep.k==='daily'||t.rep.days.includes(w))).forEach(t=>{if(!S.tasks.some(x=>x.tpl===t.id&&x.st==='prog'))toDay(t)})}
 sched();S.last=td;S.created=S.created||td;save();
 if(bkDays()>=14&&S.remind!==td){S.remind=td;save();setTimeout(()=>toast(tr('Minęło {n} dni od ostatniej kopii. Zrób eksport w Ustawieniach (⚙).',{n:bkDays()}),6000),700)}}
const pend=()=>S.log.filter(l=>l.res==='fail'&&!l.reason);
const rs=()=>{const m={};S.log.forEach(l=>l.reason&&(m[l.reason]=(m[l.reason]||0)+1));return S.reasons.map(q=>({...q,n:m[q.id]||0}))};
const bkDays=()=>Math.floor((Date.now()-(S.lastBackup||Date.parse((S.created||today())+'T12:00:00')))/864e5);
const rname=id=>(S.reasons.find(r=>r.id===id)||{name:tr('(usunięta)')}).name;
/* --- tygodnie --- */
const wd0=()=>(new Date().getDay()+6)%7;
const wstart=o=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-wd0()-7*o)};
const wend=(o,part)=>{const s=wstart(o);return new Date(s.getFullYear(),s.getMonth(),s.getDate()+(part?wd0():6))};
const cnt=(o,part,r='done')=>{const a=ds(wstart(o)),b=ds(wend(o,part));return S.log.filter(l=>l.res===r&&l.area===S.area&&l.date>=a&&l.date<=b).length};
/* --- widoki --- */
const nowT=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
const rt=x=>x.rep.k==='daily'?tr('codziennie'):x.rep.k==='days'?[1,2,3,4,5,6,0].filter(d=>x.rep.days.includes(d)).map(d=>DN(d)).join(', '):'';
const badge=x=>{const o=x.tpl?(S.tasks.find(q=>q.id===x.tpl)||x):x;return(x.imp?'<b class=st>★</b>':'')+(x.rep.k!=='none'||x.tpl?'<i class=rp>↻'+(rt(o)?' '+rt(o):'')+'</i>':'')};
const tm=(x,p)=>x.time?`<span class="tm${p&&x.time<nowT()?' late':''}">${x.time}</span>`:'';
const b=(a,id,t,c='',at='')=>`<button class="${c}" ${at} data-a="${a}" data-id="${id}">${t}</button>`;
const desc=(x,acts)=>`<div class=ds>${x.d?esc(x.d).replace(/\n/g,'<br>'):'<em>'+tr('Brak opisu')+'</em>'}<div class=acts>${acts}</div></div>`;
function vProg(){const l=prog();if(!l.length){const dn=S.log.some(y=>y.res==='done'&&y.area===S.area&&y.date===today());return`<p class=empty>${dn?tr('Wszystko zrobione na dziś. Brawo!'):tr('Na dziś nic nie zaplanowano. Wpisz zadanie na dole albo weź coś z listy.')}</p><div class=row><button class="sm pri" data-a=tab data-tab=todo>${tr('Weź coś z „Do zrobienia”')}</button></div>`}
 return l.map((x,i)=>`<div class=c><div class=r><div class=ti data-a=tg data-id="${x.id}">${badge(x)}${esc(x.t)}${x.cnt>1?` ${x.n||0}/${x.cnt}`:''}${tm(x,1)}${x.date<today()?`<span class=tm>${tr('od {d}',{d:dm(x.date)})}</span>`:''}</div><div class=bt>`+
 (sort?b('up',x.id,'▲<small>'+tr('wyżej')+'</small>','',i?'':'disabled')+b('dn',x.id,'▼<small>'+tr('niżej')+'</small>')+b('top',x.id,'⤒<small>'+tr('na górę')+'</small>'):(x.cnt>1?b('pl',x.id,'+1','ok'):b('ok',x.id,'✓<small>'+tr('zrobione')+'</small>','ok')))+
 `</div></div>${x.cnt>1?`<div style="height:6px;border-radius:3px;background:var(--ln);margin-top:6px"><div style="height:100%;width:${Math.round(100*(x.n||0)/x.cnt)}%;background:var(--ac);border-radius:3px"></div></div>`:''}${open===x.id?desc(x,(x.cnt>1?b('mn',x.id,'−1','sm'):'')+b('fl',x.id,tr('Porażka'),'sm')+b('no',x.id,tr('Odłóż do „Do zrobienia”'),'sm')+b('edit',x.id,tr('Edytuj'),'sm')):''}</div>`).join('')}
function vTodo(){const q=tsort?'':(($('q')||{}).value||'');
 const l=tdl(S.area).filter(x=>x.t.toLowerCase().includes(q.toLowerCase()));
 const ch=x=>`${badge(x)}${esc(x.t)}${x.cnt>1?`<span class=tm>${tr('×{n} dziennie',{n:x.cnt})}</span>`:''}${tm(x)}${x.at?`<span class=tm>${tr('w Dzisiaj od {d}',{d:dm(x.at)})}</span>`:''}`;
 if(tsort)return l.map((x,i)=>`<div class=c><div class=r><div class=ti>${ch(x)}</div><div class=bt>${b('tup',x.id,'▲<small>'+tr('wyżej')+'</small>','',i?'':'disabled')}${b('tdn',x.id,'▼<small>'+tr('niżej')+'</small>','',i<l.length-1?'':'disabled')}${b('ttop',x.id,'⤒<small>'+tr('na górę')+'</small>','',i?'':'disabled')}</div></div></div>`).join('');

function vDone(){const c0=cnt(0,1),c1=cnt(1,1),f0=cnt(0,1,'fail'),d=c0-c1,p=c0+f0?Math.round(100*c0/(c0+f0))+'%':'–';
