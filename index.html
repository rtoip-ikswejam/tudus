<script>
/* --- Izolacja środowiska i niezależny bezpiecznik startowy (Dead Man's Switch) --- */
window.__IS_TEST = /\/test(\/|$)/.test(location.pathname);
window.__APP_ALIVE = false;
window.__PROD_URL = window.__IS_TEST ? location.pathname.replace(/\/test(\/.*)?$/, '/') : './';
(function(){
  if(!window.__IS_TEST) return;
  document.title = 'Tuduś [TEST]';
  function rescue(reason){
    if(document.getElementById('__test_rescue')) return;
    var d = document.createElement('div');
    d.id = '__test_rescue';
    d.setAttribute('style','position:fixed;inset:0;z-index:2147483647;background:#1a1e29;color:#ffffff;font:16px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center');
    d.innerHTML = '<div style="background:#d97706;color:#fff;font-weight:800;font-size:12px;letter-spacing:1px;padding:4px 10px;border-radius:999px;margin-bottom:14px">TRYB TESTOWY · AWARYJNY POWRÓT</div>'
      + '<div style="font-size:20px;font-weight:700;margin-bottom:8px">Wersja testowa nie odpowiada</div>'
      + '<div style="color:#cbd5e1;font-size:14px;max-width:340px;margin-bottom:22px">' + (reason || 'Wykryto problem z uruchomieniem lub obsługą nowej wersji. Twoje dane produkcyjne są bezpieczne.') + '</div>'
      + '<a href="' + window.__PROD_URL + '" style="display:inline-block;background:#287247;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px;font-size:16px">← Wróć do wersji produkcyjnej</a>';
    (document.body || document.documentElement).appendChild(d);
  }
  window.__testRescue = rescue;
  setTimeout(function(){ if(!window.__APP_ALIVE) rescue('Aplikacja testowa nie uruchomiła się w wyznaczonym czasie.'); }, 5000);
  var taps = 0, tapT = null, holdT = null;
  document.addEventListener('pointerdown', function(e){
    var g = e.target && e.target.closest && e.target.closest('.gear');
    if(!g) return;
    clearTimeout(holdT);
    holdT = setTimeout(function(){ rescue('Wymuszono powrót przez przytrzymanie przycisku ustawień.'); }, 1500);
  }, true);
  document.addEventListener('pointerup', function(){ clearTimeout(holdT); }, true);
  document.addEventListener('pointercancel', function(){ clearTimeout(holdT); }, true);
  document.addEventListener('click', function(e){
    var g = e.target && e.target.closest && e.target.closest('.gear');
    if(!g) return;
    taps++;
    clearTimeout(tapT);
    if(taps >= 3){ taps = 0; rescue('Wymuszono powrót przez potrójne kliknięcie ustawień.'); return; }
    tapT = setTimeout(function(){ taps = 0; }, 900);
  }, true);
})();
</script>

const LG=window.LANGS||{};

function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.tasks)return migrate(s)}catch(e){}
return migrate({schema:SCHEMA,tasks:[],log:[],last:'',reasons:SEEDR.map((n,i)=>({id:'r'+i,name:tr(n)}))})}
function migrate(s){if(!s.areas||!s.areas.length)s.areas=[{id:'a1',name:tr('Prywatna')},{id:'a2',name:tr('Zawodowa')}];if(!s.areas.some(a=>a.id===s.area))s.area=s.areas[0].id;const d=s.areas[0].id;(s.tasks||[]).forEach(x=>{if(!x.area)x.area=d});(s.log||[]).forEach(x=>{if(!x.area)x.area=d});s.areas.forEach((a,i)=>{if(!a.color)a.color=PAL[i%PAL.length]});if(!s.ro){const m={};(s.log||[]).forEach(l=>{if(l.reason)m[l.reason]=(m[l.reason]||0)+1});(s.reasons=s.reasons||[]).sort((a,b)=>(m[b.id]||0)-(m[a.id]||0)||a.name.localeCompare(b.name,LANG));s.ro=1}if(!s.pm){(s.areas||[]).forEach(a=>{const l=(s.tasks||[]).filter(x=>x.area===a.id&&!x.tpl&&x.st==='todo').reverse(),z=x=>x.rep&&x.rep.k!=='none'||x.at;[...l.filter(x=>!z(x)),...l.filter(z)].forEach((x,i)=>x.po=i)});s.pm=1}if(typeof s.coins!=='number')s.coins=0;if(!s.wk||typeof s.wk!=='object'||Array.isArray(s.wk))s.wk={};if(![0,2,3,4].includes(s.keep))s.keep=0;s.rate=s.rate||{d:2,f:1};s.shop=s.shop||[];s.buys=s.buys||[];s.recap=s.recap||[];s.schema=SCHEMA;return s}

const NEEDLANG=(()=>{try{if(localStorage.getItem('kanban-lang')!==null)return false}catch(e){return false}return S.tasks.length===0&&S.log.length===0})();
const LNAME={pl:'Polski',en:'English'};

let DG=(()=>{try{const j=JSON.parse(localStorage.getItem(LK));if(j&&Array.isArray(j.e))return{e:j.e,a:Array.isArray(j.a)?j.a:[],srv:j.srv||0}}catch(e){}return{e:[],a:[],srv:0}})();

const AGG_PEND=8;
const aDt=d=>{const p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)};
const aSt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

 g[k]++;if(l.date>=g.l){g.l=l.date;g.t=l.title||''}}
function aggTotals(s){const t={wk:JSON.parse(JSON.stringify(s.wk||{}))};(s.log||[]).forEach(l=>{if(l.date)aggAdd(t,l)});const o=[];
 Object.keys(t.wk).sort().forEach(a=>Object.keys(t.wk[a]).sort().forEach(w=>{const x=t.wk[a][w];o.push([a,w,x.d,x.f,x.p,x.ce,x.cl].join('|'));
  Object.keys(x.r).sort().forEach(rk=>Object.keys(x.r[rk]).sort().forEach(tk=>{const g=x.r[rk][tk];o.push(['r',a,w,rk,tk,g.p,g.f,g.l].join('|'))}))}));return o.join('\n')}
function aggCompact(s,td,keep){s.wk=s.wk||{};const cut=aMon(td,keep-1),pcut=aMon(td,AGG_PEND),mv=[],rest=[];
 (s.log||[]).forEach(l=>(aElig(l,cut,pcut)?mv:rest).push(l));mv.forEach(l=>aggAdd(s,l));s.log=rest;
 const ref=new Set(rest.map(l=>l.tid)),n0=s.tasks.length;

 return{ent:mv.length,tasks:n0-s.tasks.length,weeks:new Set(mv.map(l=>aMon(l.date))).size,cut}}

 if(!r.ent&&!r.tasks)return{ok:true,none:true,ent:0,tasks:0,weeks:0,saved:0,c:s};

document.addEventListener('input',e=>{if(e.target.id==='q'){const v=e.target.value;$('main').innerHTML=vTodo();const q=$('q');q.focus();q.setSelectionRange(v.length,v.length)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='rd'||t.id==='rf'){S.rate[t.id==='rd'?'d':'f']=Math.max(0,Math.min(99,Math.floor(+t.value)||0));save();render();return}
 if(t.id==='per'){per=+t.value;smore=null;open=null;render();return}
 if(t.id==='keepsel'){onKeep(+t.value);return}
 if(t.id==='thsel'){applyTheme(t.value);render();return}
 if(t.id==='lg'){LANG=t.value;try{localStorage.setItem('kanban-lang',LANG)}catch(x){}render();return}
 if(t.dataset.ch){const l=S.log.find(y=>y.id===t.dataset.id);if(!l)return;
  if(t.dataset.ch==='r'){l.reason=t.value||null}else{l.dec=t.value;const k=S.tasks.find(y=>y.id===l.tid);if(k&&!k.tpl&&['todo','arch'].includes(k.st)){k.st=t.value==='cancel'?'arch':'todo';if(k.st==='todo')place(k,'top')}}
  save();render()}
 if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.tasks)||!Array.isArray(j.log))throw 0;
  ask(tr('Wczytanie kopii zastąpi wszystkie obecne dane.'),[[tr('Zastąp dane'),'y']],()=>{delete j.app;S=j;migrate(S);S.reasons=S.reasons||[];save();roll();render();toast(tr('Kopia wczytana'))})}catch(x){toast(tr('To nie jest poprawny plik kopii'))}};r.readAsText(t.files[0])}});
/* --- start i aktualizacje --- */
if('serviceWorker'in navigator){let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=1;if(pendingSW)location.reload()}});
 navigator.serviceWorker.register('sw.js').then(r=>{const u=w=>{pendingSW=w;probe()},watch=n=>{if(n)n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)u(n)})};
  if(r.waiting&&navigator.serviceWorker.controller)u(r.waiting);watch(r.installing);r.addEventListener('updatefound',()=>watch(r.installing));
  const chk=()=>{try{r.update().catch(()=>{})}catch(e){}};chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}).catch(()=>{})}
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.last!==today()){roll();render();showRecap()}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render())}catch(e){}
roll();runCons(true);render();startDiag();
window.__APP_ALIVE = true;
if(NEEDLANG)langGate();
{const sp=$('splash');if(sp){$('spv').textContent='v'+V+(IS_TEST?' · TRYB TESTOWY':'');const hide=()=>{if(sp.dataset.h)return;sp.dataset.h=1;sp.classList.add('off');setTimeout(()=>{sp.remove();afterSplash()},300)};sp.onclick=hide;setTimeout(hide,Math.max(0,SPLASH_MS-performance.now()))}else afterSplash()}
</script></body></html>
